<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Amostra da voz premium — UM Contador de Histórias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<!-- Ferramenta do dono (fora do app): grava a amostra da voz premium com a chave do Gemini já salva no
     Contador (mesmo endereço). Gera sozinha ao abrir. A chave não é gravada aqui e só vai para o Google.
     Usa os mesmos dois caminhos do Contador: /interactions (modelos 3.x) e generateContent (2.5). -->
<style>
  body{font:17px/1.5 system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;background:#140f22;color:#f2ecff}
  h1{font-size:24px;margin:0 0 14px}
  select,button,textarea,input{width:100%;margin-top:10px;padding:14px;border-radius:16px;border:1px solid #3a2f5e;background:#1d1633;color:#f2ecff;font-size:17px;box-sizing:border-box;font-family:inherit}
  button{background:linear-gradient(135deg,#ffc879,#ff9d5c);color:#2a1705;font-weight:800;border:none;cursor:pointer}
  button.sec{background:#2e2450;color:#f2ecff;border:1px solid #3a2f5e;font-weight:700}
  button.ok{background:linear-gradient(135deg,#5fd6a4,#3fae83);color:#06301f}
  button[disabled]{opacity:.5;cursor:default}
  audio{width:100%;margin-top:12px}
  .box{background:#241c3d;border:1px solid #3a2f5e;border-radius:18px;padding:16px;margin-top:14px}
  .err{color:#ff9aac} .dim{color:#8c7cb4;font-size:14px}
  details{margin-top:18px} summary{cursor:pointer;color:#b6a8d8;font-size:15px}
  textarea{min-height:90px;font-size:15px}
</style>
</head>
<body>
<h1 id="titulo">🎙️ Amostra da voz premium</h1>

<div class="box" id="passo-chave" style="display:none">
  <div id="txt-chave"></div>
  <input type="password" id="chave" autocomplete="off" placeholder="AIza… / AQ…">
</div>

<select id="voz" aria-label="Voz"></select>
<button id="gerar">✨ Gerar</button>
<div class="box err" id="aviso" style="display:none"></div>

<div class="box" id="resultado" style="display:none">
  <audio id="player" controls></audio>
  <button class="ok" id="baixar">⬇️ 1. Baixar</button>
  <button class="sec" id="enviar">📤 2. Enviar para o app</button>
  <div class="dim" id="dica-envio" style="margin-top:10px"></div>
</div>

<details>
  <summary id="txt-mais">Mais opções</summary>
  <select id="modelo" aria-label="Modelo">
    <option value="gemini-3.1-flash-tts-preview">3.1 Flash TTS</option>
    <option value="gemini-2.5-pro-preview-tts">2.5 Pro TTS</option>
    <option value="gemini-2.5-flash-preview-tts">2.5 Flash TTS</option>
  </select>
  <div class="dim" style="margin-top:10px" id="txt-idioma">Idioma da amostra</div>
  <select id="lingua"><option value="pt">Português</option><option value="en">English</option></select>
  <textarea id="estilo" aria-label="Jeito de falar"></textarea>
  <textarea id="frase" aria-label="Frase"></textarea>
</details>

<script>
(function(){
  'use strict';
  var FRASE = {
    pt: 'Era uma vez, lá no alto de uma colina onde o vento sabia assobiar, uma estrelinha que tinha medo do escuro… Toda noite ela se escondia atrás da lua e sussurrava: — Será que alguém vai me encontrar? E sabe quem encontrou? … Você. Agora fecha os olhinhos… que a história vai começar.',
    en: 'Once upon a time, high on a hill where the wind knew how to whistle, there lived a little star who was afraid of the dark… Every night she hid behind the moon and whispered: "Will anyone ever find me?" And do you know who found her? … You. Now close your eyes… the story is about to begin.'
  };
  var ESTILO = {
    pt: 'Leia como uma contadora de histórias brasileira na hora de dormir: voz calorosa e calma, ritmo lento, pausas longas nas reticências. Sussurre a pergunta da estrelinha, faça uma pausa antes de "Você" e termine bem baixinho.',
    en: 'Read like a warm bedtime storyteller: calm, gentle voice, slow pace, long pauses at the ellipses. Whisper the little star\'s question, pause before "You" and end very softly.'
  };
  var VOZES = [['Sulafat','calorosa','warm'],['Achernar','suave','soft'],['Vindemiatrix','gentil','gentle'],['Enceladus','sussurrada','breathy'],
    ['Rasalgethi','narradora','narrator'],['Umbriel','tranquila','easy-going'],['Leda','jovem','youthful'],['Aoede','leve','breezy'],['Despina','macia','smooth']];
  var UPLOAD = 'https://github.com/MarceloNeco/contador-de-historias/upload/main';
  var $ = function (s) { return document.querySelector(s); };
  var cfgApp = {}, idioma = 'pt', ultimo = null;
  try { cfgApp = JSON.parse(localStorage.getItem('ch_config') || '{}') || {}; } catch (e) {}
  try { var salvo = JSON.parse(localStorage.getItem('dgo:global:idioma') || 'null'); idioma = salvo === 'en' ? 'en' : (salvo ? 'pt' : ((navigator.language || '').indexOf('en') === 0 ? 'en' : 'pt')); } catch (e) {}
  var t = function (pt, en) { return idioma === 'en' ? en : pt; };
  var chave = function () { return cfgApp.geminiKey || $('#chave').value.trim(); };

  // textos (poucos, nos dois idiomas)
  $('#titulo').textContent = t('🎙️ Amostra da voz premium', '🎙️ Premium voice sample');
  $('#gerar').textContent = t('✨ Gerar', '✨ Create');
  $('#baixar').textContent = t('⬇️ 1. Baixar', '⬇️ 1. Download');
  $('#enviar').textContent = t('📤 2. Enviar para o app', '📤 2. Send to the app');
  $('#txt-mais').textContent = t('Mais opções', 'More options');
  $('#txt-idioma').textContent = t('Idioma da amostra', 'Sample language');
  $('#voz').innerHTML = VOZES.map(function (v) { return '<option value="' + v[0] + '">' + v[0] + ' — ' + (idioma === 'en' ? v[2] : v[1]) + '</option>'; }).join('');
  if (cfgApp.geminiVoice && VOZES.some(function (v) { return v[0] === cfgApp.geminiVoice; })) $('#voz').value = cfgApp.geminiVoice;
  if (cfgApp.geminiModelTts && $('#modelo').querySelector('option[value="' + cfgApp.geminiModelTts + '"]')) $('#modelo').value = cfgApp.geminiModelTts;
  function usarLingua(l) { $('#lingua').value = l; $('#frase').value = FRASE[l]; $('#estilo').value = ESTILO[l]; }
  usarLingua(idioma);
  $('#lingua').onchange = function () { usarLingua($('#lingua').value); };
  if (!cfgApp.geminiKey) {
    $('#passo-chave').style.display = '';
    $('#txt-chave').textContent = t('Cole a sua chave do Gemini (a mesma do Contador). Ela não fica guardada.', 'Paste your Gemini key (the same as the Storyteller). It is not stored.');
  }

  function aviso(m) { var a = $('#aviso'); a.style.display = m ? '' : 'none'; a.textContent = m || ''; }
  function acharAudio(o, prof) {
    prof = prof || 0;
    if (!o || typeof o !== 'object' || prof > 7) return null;
    if (o.inlineData && typeof o.inlineData.data === 'string') return o.inlineData;
    if (o.inline_data && typeof o.inline_data.data === 'string') return { data: o.inline_data.data, mimeType: o.inline_data.mime_type || '' };
    if (typeof o.data === 'string' && o.data.length > 500) return { data: o.data, mimeType: o.mime_type || o.mimeType || '' };
    for (var k in o) { var r = acharAudio(o[k], prof + 1); if (r) return r; }
    return null;
  }
  // PCM 16 bits mono → WAV
  function wav(b64, taxa) {
    var bin = atob(b64), n = bin.length, buf = new ArrayBuffer(44 + n), v = new DataView(buf), i;
    var txt = function (o, s) { for (var k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    txt(0, 'RIFF'); v.setUint32(4, 36 + n, true); txt(8, 'WAVE'); txt(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, taxa, true); v.setUint32(28, taxa * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    txt(36, 'data'); v.setUint32(40, n, true);
    var u8 = new Uint8Array(buf, 44); for (i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: 'audio/wav' });
  }
  function pedir(url, corpo) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': chave() }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.text().then(function (x) { if (!r.ok) { var e = new Error('Gemini ' + r.status + ': ' + x.slice(0, 160)); e.status = r.status; throw e; } return JSON.parse(x); }); });
  }
  // os dois caminhos do Contador: modelos 3.x respondem em /interactions; os 2.5, em generateContent
  function gerarAudio(modelo, voz, texto) {
    var viaInteractions = function () {
      return pedir('https://generativelanguage.googleapis.com/v1beta/interactions',
        { model: modelo, input: texto, response_format: { type: 'audio' }, generation_config: { speech_config: [{ voice: voz }] } });
    };
    var viaGenerate = function () {
      var m = /^gemini-3/.test(modelo) ? 'gemini-2.5-flash-preview-tts' : modelo;
      return pedir('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(m) + ':generateContent',
        { contents: [{ parts: [{ text: texto }] }], generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voz } } } } });
    };
    var primeiro = /^gemini-3/.test(modelo) ? viaInteractions : viaGenerate, segundo = primeiro === viaInteractions ? viaGenerate : viaInteractions;
    return primeiro().catch(function (e) { if (e.status === 401 || e.status === 403) throw e; return segundo(); })
      .then(function (j) {
        var a = acharAudio(j);
        if (!a) throw new Error(t('O Gemini não devolveu áudio. Toque em Gerar de novo.', 'Gemini returned no audio. Tap Create again.'));
        return wav(a.data, Number(((a.mimeType || '').match(/rate=(\d+)/) || [])[1] || 24000));
      });
  }

  function gerar() {
    if (!chave()) { aviso(t('Cole a chave do Gemini primeiro.', 'Paste the Gemini key first.')); return; }
    var b = $('#gerar'); b.disabled = true; b.textContent = t('Gerando… (até 30 segundos)', 'Creating… (up to 30 seconds)'); aviso('');
    var estilo = $('#estilo').value.trim(), frase = $('#frase').value.trim();
    gerarAudio($('#modelo').value, $('#voz').value, (estilo ? estilo + '\n\n' : '') + frase).then(function (blob) {
      if (ultimo) URL.revokeObjectURL(ultimo.url);
      ultimo = { blob: blob, url: URL.createObjectURL(blob), nome: $('#lingua').value === 'en' ? 'amostra-voz-premium-en.wav' : 'amostra-voz-premium.wav' };
      $('#resultado').style.display = '';
      var p = $('#player'); p.src = ultimo.url; p.play().catch(function () {});
      $('#dica-envio').textContent = t('No GitHub: arraste o arquivo baixado (' + ultimo.nome + ') e toque no botão verde "Commit changes". Pronto.',
        'On GitHub: drag the downloaded file (' + ultimo.nome + ') and tap the green "Commit changes" button. Done.');
    }).catch(function (e) {
      var s = e.status;
      aviso(s === 429 ? t('A cota grátis acabou por agora. Em "Mais opções", troque o modelo, ou tente mais tarde.', 'The free quota is used up for now. Under "More options", switch model, or try later.')
        : s === 401 || s === 403 ? t('O Google recusou a chave.', 'Google refused the key.')
        : (e.message || String(e)));
    }).then(function () { b.disabled = false; b.textContent = t('✨ Gerar de novo', '✨ Create again'); });
  }

  $('#gerar').onclick = gerar;
  $('#voz').onchange = gerar;
  $('#baixar').onclick = function () {
    if (!ultimo) return;
    var a = document.createElement('a'); a.href = ultimo.url; a.download = ultimo.nome; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#enviar').onclick = function () { window.open(UPLOAD, '_blank', 'noopener'); };
  if (cfgApp.geminiKey) gerar();     // com a chave do Contador, já começa sozinha
})();
</script>
</body>
</html>
